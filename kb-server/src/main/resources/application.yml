spring:
  application:
    name: eon-kb

  # 文件上传
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Spring AI - 通过 OpenAI 兼容协议配置 DeepSeek Chat 模型（用于查询改写 / 答案生成）
  # 注意：Embedding 与 PgVectorStore 由 kb-core 的独立配置接管，
  #       OpenAiEmbeddingAutoConfiguration / PgVectorStoreAutoConfiguration 已在启动类排除。
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:tp-c654g8cbqqn3xxxxxxxxxfoincdh9vfovfm8ez5klpze5d}
      base-url: ${DEEPSEEK_BASE_URL:https://token-plan-cn.xiaomimimo.com}
      chat:
        options:
          model: mimo-v2.6-flash
          temperature: 0.2
    vectorstore:
      pgvector:
        table-name: kb_chunks
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: false
        max-document-batch-size: 20

# 应用自定义配置
app:
  # 知识库独立数据源（与宿主应用的数据源隔离，前缀为 app.datasource）
  datasource:
    jdbc-url: ${KB_DB_URL:jdbc:postgresql://127.0.0.1:15432/eon-kb}
    username: ${KB_DB_USERNAME:postgres}
    password: ${KB_DB_PASSWORD:xxxx}
    driver-class-name: org.postgresql.Driver
  embedding:
    api-key: ${DASHSCOPE_API_KEY:sk-ws-H.RYHDILP.ASaw.x6JoAY0Y}
    base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    model: text-embedding-v4
    dimensions: 1024
  rerank:
    api-key: ${DASHSCOPE_API_KEY:sk-ws-H.RYHDILP.ASaw.MxUMj_C16JoAY0Y}
    base-url: ${DASHSCOPE_RERANK_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1}
    model: qwen3-rerank
    top-n: 5
  retrieval:
    vector-top-k: 20
    fulltext-top-k: 20
    fuzzy-top-k: 10
    rrf-k: 60
    fusion-top-k: 10
    hyde-enabled: false
  chunking:
    target-tokens: 512
    max-tokens: 1024
    overlap-tokens: 50
  polish:
    enabled: false                    # 润色功能总开关
    max-requests-per-minute: 30      # 速率限制（请求/分钟）
    max-content-length: 8000         # 超过此长度的切片跳过润色
  # 文档解析配置（本地 Tika/POI 始终可用，LlamaParse 为云端增强，按类型路由）
  parsing:
    llamaparse:
      enabled: ${LLAMA_CLOUD_ENABLED:true}   # 云端解析总开关（默认关闭，纯本地运行）
      api-key: ${LLAMA_CLOUD_API_KEY:llx-UJPgxtS2eZHclR3vqdFOInh1}         # LlamaCloud API Key（llx- 开头）
      base-url: ${LLAMA_CLOUD_BASE_URL:https://api.cloud.llamaindex.ai}
      tier: FAST                               # 解析档位：FAST / COST_EFFECTIVE / AGENTIC / AGENTIC_PLUS（按页计费依次递增）
      ocr-languages: [ch_sim]                  # OCR 语言（仅图片内文字识别），如 ch_sim/ch_tra/en；空列表=服务端默认
      merge-continued-tables: false            # 跨页续表合并；副作用：输出不分页且移除页眉页脚，影响按页提取
      poll-interval-ms: 2000                   # 任务轮询间隔（毫秒）
      timeout-minutes: 10                      # 单文档解析总超时（分钟）
      types: pdf,docx,pptx                     # 走云端解析的文档类型；xlsx/txt/md/html 始终本地解析（省配额）
  # 跨域来源（allowCredentials=true 时浏览器规范不允许 * 源携带 Cookie；生产建议改为显式域名列表）
  cors:
    allowed-origin-patterns: "*"
  generation:
    max-context-tokens: 6000
    system-prompt-tokens: 500
    question-prompt-tokens: 200
    output-reserve-tokens: 1000
  # 线程池配置（按职责拆分，可在线下调优无需重编译）
  thread-pool:
    ingestion:
      core: 2
      max: 4
      queue: 10
    search:
      core: 4
      max: 8
      queue: 50

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    cn.kong.kb: DEBUG
    org.springframework.ai: INFO
